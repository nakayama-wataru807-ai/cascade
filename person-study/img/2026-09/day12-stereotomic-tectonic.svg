<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" font-family="'BIZ UDGothic', sans-serif">
  <rect width="400" height="230" fill="#F5F0E8"/>
  <text x="100" y="24" text-anchor="middle" font-size="12" fill="#1C1C1A">ステレオトミック</text>
  <text x="300" y="24" text-anchor="middle" font-size="12" fill="#1C1C1A">テクトニック</text>

  <!-- stereotomic: mass with arched void -->
  <path d="M30 190 V70 H170 V190 Z M60 190 V120 a40 40 0 0 1 80 0 V190 Z" fill="#5C4033" fill-rule="evenodd"/>
  <text x="100" y="210" text-anchor="middle" font-size="10.5" fill="#3D3B33">圧縮の量塊：石積み・大地・掘る</text>

  <!-- tectonic: post and beam frame -->
  <g stroke="#4A5C42" stroke-width="7" stroke-linecap="round">
    <line x1="245" y1="185" x2="245" y2="80"/>
    <line x1="355" y1="185" x2="355" y2="80"/>
    <line x1="238" y1="80" x2="362" y2="80"/>
    <line x1="245" y1="120" x2="355" y2="120"/>
    <line x1="300" y1="80" x2="245" y2="120"/>
    <line x1="300" y1="80" x2="355" y2="120"/>
  </g>
  <circle cx="245" cy="80" r="5" fill="#C4833A"/>
  <circle cx="355" cy="80" r="5" fill="#C4833A"/>
  <text x="300" y="210" text-anchor="middle" font-size="10.5" fill="#3D3B33">引張の軸組：線材を継ぐ・架ける</text>

  <line x1="200" y1="40" x2="200" y2="200" stroke="#1C1C1A" stroke-width="0.5" stroke-dasharray="3 3"/>
</svg>
