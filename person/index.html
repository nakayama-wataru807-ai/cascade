<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>人物</title>
<style>
:root {
  /* ── モノクロ基調（白／インク／グレー1色）＋アクセント1色 ── */
  --bg: #FFFFFF;
  --bg-sink: #F4F4F2;
  --ink: #1A1A1A;
  --ink-soft: #33332F;
  --ink-mute: #6B6B6B;
  --accent: #F0531C;          /* シグナルオレンジ。マーカー・塗り・下線のみ。文字色には使わない */
  --line: rgba(0,0,0,0.10);
  --line-strong: rgba(0,0,0,0.20);
  --shadow: none;
  --shadow-up: none;

  /* ── 旧トークンの別名（JS 内インラインスタイルとの後方互換）── */
  --kinari: #FFFFFF;
  --kinari-2: #FFFFFF;
  --kinari-3: #F4F4F2;
  --sumi: #1A1A1A;
  --sumi-soft: #33332F;
  --sumi-muted: #6B6B6B;
  --ki: #1A1A1A;
  --ki-pale: #F4F4F2;
  --ki-deep: #1A1A1A;
  --take: #1A1A1A;

  /* 2026-11-07: 起動を軽くするため、ウェブフォント（Noto Sans JP・Inter）をやめてシステム書体にした（起動時の転送の約95%がフォントだった） */
  --font-mincho: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans CJK JP", system-ui, sans-serif;
  --font-gothic: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans CJK JP", system-ui, sans-serif;
  --font-latin: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, system-ui, sans-serif;
  --r1: 0; --r2: 3px; --r3: 4px; --r4: 8px;
  --ease-struct: cubic-bezier(0.2, 0.6, 0.2, 1);
  --ease-snap: cubic-bezier(0.2, 0.6, 0.2, 1);
  --nav-h: calc(58px + env(safe-area-inset-bottom));
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-gothic);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.75;
  letter-spacing: 0.01em;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ── 1アプリ1機能の殻（2026-11-07・Cascade 本体から切り出し）── */
#app { max-width: 480px; margin: 0 auto; padding: 28px 22px 56px; min-height: 100dvh; }
.topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 26px; }
.topbar .screen-title { margin-bottom: 0; }
.back { font-family: var(--font-gothic); font-size: 12px; color: var(--ink-mute); text-decoration: none; letter-spacing: 0.04em; }

.screen-title {
  font-family: var(--font-gothic);
  font-weight: 700;
  font-size: clamp(21px, 6vw, 26px);
  color: var(--ink);
  letter-spacing: 0.01em;
  line-height: 1.3;
  margin-bottom: 26px;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-gothic);
  font-size: 13px;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: var(--r2);
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  z-index: 300;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.ps-empty { font-size: 15px; color: var(--ink-mute); line-height: 2; text-align: center; padding: 44px 14px; }


.data-btn-row { display: flex; gap: 8px; }
.data-btn {
  flex: 1;
  padding: 11px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-gothic);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  border: 1px solid var(--line-strong);
  border-radius: var(--r2);
  cursor: pointer;
  -webkit-appearance: none;
  transition: background 0.2s, border-color 0.2s;
}
.data-btn:active { background: var(--bg-sink); border-color: var(--ink); }

/* ── 人物研究 ── */
.ps-head { display: flex; gap: 13px; align-items: flex-start; margin-bottom: 16px; }
.ps-portrait { width: 60px; height: 60px; border-radius: var(--r2); object-fit: cover; flex-shrink: 0; background: var(--bg-sink); filter: grayscale(1); }
.ps-name { font-family: var(--font-gothic); font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.35; }
.ps-sub { font-size: 12px; color: var(--ink-mute); margin-top: 3px; font-family: var(--font-latin); letter-spacing: .03em; line-height: 1.45; }
.ps-oneliner { font-size: 13.5px; color: var(--ink-soft); margin-top: 8px; line-height: 1.7; }
.ps-progress { font-family: var(--font-latin); font-size: 12px; color: var(--ink-mute); letter-spacing: .06em; margin-bottom: 16px; }
.ps-progress b { color: var(--ink); }
.ps-tabs { display: flex; gap: 20px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.ps-tab { padding: 8px 0; font-size: 13px; font-family: var(--font-gothic); background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--ink-mute); cursor: pointer; }
.ps-tab.active { background: none; border-bottom-color: var(--accent); color: var(--ink); font-weight: 700; }
.ps-topic { background: var(--bg); border-radius: 0; border-left: none; border-top: 1px solid var(--line); padding: 20px 0 4px; margin-bottom: 14px; }
.ps-topic .cat { display: inline-block; font-family: var(--font-latin); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); background: none; border: 1px solid var(--line-strong); border-radius: 0; padding: 3px 8px; margin-bottom: 13px; }
.ps-topic h3 { font-family: var(--font-gothic); font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.55; margin-bottom: 14px; letter-spacing: .01em; }
.ps-topic .body { font-size: 15.5px; line-height: 2; color: var(--ink-soft); }
.ps-topic img { width: 100%; height: auto; border-radius: var(--r2); margin: 16px 0 5px; display: block; }
.ps-topic .cap { font-size: 12px; color: var(--ink-mute); line-height: 1.6; }
.ps-topic .quote { border-left: 2px solid var(--ink); padding-left: 14px; margin: 16px 0; font-family: var(--font-gothic); font-size: 15px; color: var(--ink-soft); font-style: normal; line-height: 1.95; }
.ps-detail { font-size: 15px; line-height: 2; color: var(--ink-soft); margin-top: 14px; }
.ps-back { background: none; border: none; color: var(--ink); font-size: 13px; padding: 4px 0 14px; cursor: pointer; font-family: var(--font-gothic); }
.ps-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
.ps-chip { font-size: 12px; background: var(--bg-sink); border-radius: 0; padding: 4px 9px; color: var(--ink-mute); }
.ps-links a { display: block; font-size: 14px; color: var(--ink); margin-top: 10px; word-break: break-all; line-height: 1.6; text-decoration: underline; text-underline-offset: 2px; }
.ps-memo { margin-top: 18px; }
.ps-memo textarea { width: 100%; min-height: 76px; border: 1px solid var(--line-strong); border-radius: var(--r2); padding: 12px; font-size: 16px; font-family: var(--font-gothic); background: var(--bg); color: var(--ink); resize: vertical; line-height: 1.75; }
.ps-memo textarea:focus { border-color: var(--ink); outline: none; }
.ps-memo-hint { font-size: 12px; color: var(--ink-mute); margin: 5px 0 8px; }
.ps-note { font-size: 14px; line-height: 1.8; color: var(--ink-soft); background: var(--bg-sink); border-radius: var(--r2); padding: 11px 13px; margin-top: 9px; }
.ps-note .ts { display: block; font-family: var(--font-latin); font-size: 11px; color: var(--ink-mute); margin-bottom: 3px; }
.ps-daylist { display: flex; flex-direction: column; gap: 0; }
.ps-dayrow { display: flex; gap: 12px; align-items: baseline; padding: 14px 2px; background: var(--bg); border-radius: 0; border-bottom: 1px solid var(--line); border-left: 2px solid transparent; cursor: pointer; }
.ps-dayrow.locked { opacity: .38; cursor: default; }
.ps-dayrow.has-note { border-left-color: var(--ink); }
.ps-dayrow .d { font-family: var(--font-latin); font-size: 12px; color: var(--ink-mute); flex-shrink: 0; width: 40px; }
.ps-dayrow .t { font-size: 14.5px; color: var(--ink-soft); line-height: 1.6; }
.ps-res h4 { font-family: var(--font-gothic); font-size: 15px; font-weight: 700; color: var(--ink); margin: 22px 0 10px; }
.ps-res a { display: block; font-size: 15px; color: var(--ink); margin: 8px 0 2px; line-height: 1.6; text-decoration: underline; text-underline-offset: 2px; }
.ps-res .meta { display: block; color: var(--ink-mute); font-size: 13px; line-height: 1.6; margin-bottom: 8px; }
.ps-empty { font-size: 15px; color: var(--ink-mute); line-height: 2; text-align: center; padding: 44px 14px; }

.sync-box { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); font-family: var(--font-gothic); font-size: 13px; color: var(--ink-soft); }
.sync-box summary { cursor: pointer; font-weight: 700; color: var(--ink-mute); font-size: 12px; letter-spacing: 0.04em; }
.sync-note { margin: 10px 0 12px; font-size: 12px; line-height: 1.7; color: var(--ink-mute); }
.sync-box label { display: block; margin: 10px 0 0; font-size: 12px; color: var(--ink-mute); }
.sync-box input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line-strong); border-radius: var(--r2); background: var(--bg); color: var(--ink); font-family: var(--font-latin); }
.sync-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.sync-actions button { padding: 10px 16px; background: var(--ink); color: var(--bg); border: none; border-radius: var(--r2); font-family: var(--font-gothic); font-size: 14px; font-weight: 700; cursor: pointer; }
#sync-state { font-size: 12px; color: var(--ink-mute); }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h2 class="screen-title">人物研究</h2>
    <a class="back" href="../">Cascade ▸</a>
  </div>
  <div id="ps-root"></div>
  <details class="sync-box" id="sync-box">
    <summary>同期の設定</summary>
    <p class="sync-note">人物研究のメモだけを、非公開のリポジトリに保存し、読み込みます（Cascade 本体と同じ設定）。別の端末や、ホーム画面に追加した直後は、ここにトークンを入れると、これまでのメモが読み込まれます。</p>
    <label>リポジトリ<input id="sync-repo" autocomplete="off" autocapitalize="off"></label>
    <label>ファイルの場所<input id="sync-path" autocomplete="off" autocapitalize="off"></label>
    <label>トークン<input id="sync-token" type="password" autocomplete="off"></label>
    <div class="sync-actions"><button id="sync-save" type="button">保存して同期</button><span id="sync-state"></span></div>
  </details>
</div>
<div class="toast" id="toast"></div>
<script>

// ── 共有の保存領域（Cascade 本体と同じ localStorage キー）──
// この人物アプリが書くのは store.personStudy と、メモ保存の自動チェック（習慣 h31）だけ。
// 保存のたびに最新を読み直し、他のスライス（習慣・各種ログ・語学など）は触らない。
const STORE_KEY = 'cascade_v1';
function loadStore() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return {};
}
let store = loadStore();
function todayStr() { return dateToStr(new Date()); }
function dateToStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function ensureToday() {
  if (!store.personStudy || typeof store.personStudy !== 'object') store.personStudy = {};   // 保存データが無い端末でも動くように
  store.habits = store.habits || { definitions: [], logs: {} };
  store.habits.logs = store.habits.logs || {};
  const t = todayStr();
  if (!store.habits.logs[t]) store.habits.logs[t] = {};
}
function psEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
function saveStore() {
  const cur = loadStore();                 // 本体が書いた最新を読み直す
  cur.personStudy = mergePerson(cur.personStudy, store.personStudy);   // 他アプリが同時に書いたメモを失わない
  const t = todayStr();
  const mine = store.habits && store.habits.logs && store.habits.logs[t];
  if (mine && mine[PS_HABIT]) {            // メモ保存の自動チェックだけを足す
    cur.habits = cur.habits || { definitions: [], logs: {} };
    cur.habits.logs = cur.habits.logs || {};
    cur.habits.logs[t] = Object.assign({}, cur.habits.logs[t], { [PS_HABIT]: true });
  }
  store = cur;
  localStorage.setItem(STORE_KEY, JSON.stringify(cur));
  scheduleSync();
}

// 人物研究のメモは月ごとに、開いた日・日ごとのメモ・全体メモを合流する（どちらの端末のメモも失わない）
function mergePerson(remote, local) {
  const out = JSON.parse(JSON.stringify(local || {}));
  for (const m of Object.keys(remote || {})) {
    const r = remote[m];
    if (!r || typeof r !== 'object') continue;
    const l = out[m];
    if (!l) { out[m] = r; continue; }
    l.opened = Array.from(new Set([].concat(l.opened || [], r.opened || []))).sort((a, b) => a - b);
    l.notes = l.notes || {};
    for (const d of Object.keys(r.notes || {})) {
      const have = l.notes[d] = l.notes[d] || [];
      const seen = new Set(have.map(n => n.ts + '\n' + n.text));
      for (const n of r.notes[d]) if (!seen.has(n.ts + '\n' + n.text)) have.push(n);
      have.sort((a, b) => ((a.ts || '') < (b.ts || '') ? -1 : 1));
    }
    if (!l.monthMemo) l.monthMemo = r.monthMemo || '';
  }
  return out;
}

// ── GitHub 同期（人物研究のメモだけ。設定は Cascade 本体と同じキー）──
const GH_KEY = 'cascade_gh_v1';
const GH_DEFAULT = { repo: 'nakayama-wataru807-ai/personal_sync', path: 'cascade/state.json' };
function loadGh() {
  try { return Object.assign({}, GH_DEFAULT, JSON.parse(localStorage.getItem(GH_KEY) || '{}')); } catch (e) { return Object.assign({}, GH_DEFAULT); }
}
function ghB64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function ghB64dec(s) {
  const bin = atob(String(s).replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
async function ghApi(g, method, url, body) {
  const r = await fetch(url, {
    method,
    headers: { 'Authorization': 'Bearer ' + g.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return r.json();
}
let syncTimer = null, syncInFlight = false, syncCooldownUntil = 0;
function scheduleSync() {
  const g = loadGh();
  if (!g.token || g.auto === false || Date.now() < syncCooldownUntil) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncPerson, 4000);
}
async function syncPerson() {
  const g = loadGh();
  if (!g.token || syncInFlight) return false;
  syncInFlight = true;
  const url = 'https://api.github.com/repos/' + g.repo + '/contents/' + g.path;
  try {
    const cur = await ghApi(g, 'GET', url);
    let payload = null;
    if (cur && cur.content) { try { payload = JSON.parse(ghB64dec(cur.content)); } catch (e) {} }
    if (!payload || !payload.store) throw new Error('同期先の形式が読めない');   // 読めないときは上書きしない
    const before = JSON.stringify(store.personStudy);
    const merged = mergePerson(payload.store.personStudy, store.personStudy);
    payload.store.personStudy = merged;          // 同期先の他のスライスは、そのまま残す
    payload.synced = new Date().toISOString();
    await ghApi(g, 'PUT', url, {
      message: '人物研究のメモを同期: ' + todayStr(),
      content: ghB64enc(JSON.stringify(payload, null, 1)),
      sha: cur.sha,
    });
    const latest = loadStore();
    latest.personStudy = merged;
    store = latest;
    localStorage.setItem(STORE_KEY, JSON.stringify(latest));
    g.last = new Date().toISOString();
    localStorage.setItem(GH_KEY, JSON.stringify(g));
    renderSyncState();
    if (JSON.stringify(merged) !== before && PS.tried) renderPerson();   // 同期先からメモが入ってきたときだけ描き直す
    return true;
  } catch (err) {
    syncCooldownUntil = Date.now() + 10 * 60 * 1000;   // 失敗が続くときは10分止める
    return false;
  } finally {
    syncInFlight = false;
  }
}

// ── 同期の設定（iPhone では、ホーム画面のアプリごとに保存領域が別になるため、このアプリ自身に設定を持つ）──
function renderSyncState() {
  const g = loadGh();
  const set = id => document.getElementById(id);
  if (!set('sync-repo')) return;
  if (document.activeElement !== set('sync-repo')) set('sync-repo').value = g.repo;
  if (document.activeElement !== set('sync-path')) set('sync-path').value = g.path;
  set('sync-token').placeholder = g.token ? '（設定済み。変えるときだけ入力）' : 'Cascade 本体と同じトークン';
  set('sync-state').textContent = g.token ? ('設定済み' + (g.last ? ' ・最終 ' + new Date(g.last).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '')) : '未設定';
}

// ── 人物研究 ──
// 毎月 cascade/person-study/<YYYY-MM>.json を Claude（/person gen）が生成する。
// 1日1トピックのニュース形式で表示し、メモは store.personStudy に端末保存（同期あり）。
const PS = { data: null, month: null, tab: 'today', tried: false, openDay: null };

const PS_HABIT = 'h31';    // メモ保存で自動チェックする習慣（人物研究）
function psMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function psSlot() {
  const m = psMonth();
  if (!store.personStudy[m]) store.personStudy[m] = { opened: [], notes: {}, monthMemo: '' };
  return store.personStudy[m];
}
function psImg(img) {
  if (!img || !img.src) return '';
  const src = /^https?:/.test(img.src) ? img.src : '../person-study/' + img.src.replace(/^\.?\//, '');
  return '<img loading="lazy" src="' + psEsc(src) + '" alt="">'
    + (img.caption ? '<div class="cap">' + psEsc(img.caption) + (img.credit ? ' — ' + psEsc(img.credit) : '') + '</div>' : '');
}

function loadPerson() {
  const m = psMonth();
  PS.month = m;
  fetch('../person-study/' + m + '.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(j => { PS.data = j; PS.tried = true; if (curView() === 'person') renderPerson(); })
    .catch(() => { PS.data = null; PS.tried = true; if (curView() === 'person') renderPerson(); });
}
function curView() { return 'person'; }

function renderPerson() {
  const root = document.getElementById('ps-root');
  if (!root) return;
  if (!PS.tried) { root.innerHTML = '<div class="ps-empty">読み込み中…</div>'; return; }
  const d = PS.data;
  if (!d || !Array.isArray(d.topics) || !d.topics.length) {
    root.innerHTML = '<div class="ps-empty">今月の人物研究はまだ準備中です。<br>準備ができるとここに毎日1トピックずつ届きます。</div>';
    return;
  }
  const today = new Date().getDate();
  const total = d.topics.length;
  const doneCount = psSlot().opened.length;

  // 今日のぶんを開封記録
  if (today <= total && !psSlot().opened.includes(today)) {
    psSlot().opened.push(today);
    saveStore();
  }

  let html = '';
  html += '<div class="ps-head">';
  if (d.portrait) html += '<img class="ps-portrait" src="' + psEsc(/^https?:/.test(d.portrait.src) ? d.portrait.src : '../person-study/' + d.portrait.src.replace(/^\.?\//, '')) + '" alt="">';
  html += '<div><div class="ps-name">' + psEsc(d.person) + '</div>'
    + '<div class="ps-sub">' + psEsc(d.person_en || '') + (d.lifespan ? ' · ' + psEsc(d.lifespan) : '') + (d.field ? ' · ' + psEsc(d.field) : '') + '</div>'
    + (d.one_liner ? '<div class="ps-oneliner">' + psEsc(d.one_liner) + '</div>' : '')
    + '</div></div>';
  html += '<div class="ps-progress">' + psEsc(d.month) + ' · <b>' + Math.min(doneCount, total) + '</b> / ' + total + ' 読了</div>';
  html += '<div class="ps-tabs">'
    + '<div class="ps-tab' + (PS.tab === 'today' ? ' active' : '') + '" data-pstab="today">今日</div>'
    + '<div class="ps-tab' + (PS.tab === 'history' ? ' active' : '') + '" data-pstab="history">これまで</div>'
    + '<div class="ps-tab' + (PS.tab === 'res' ? ' active' : '') + '" data-pstab="res">資料</div>'
    + '</div>';
  html += '<div id="ps-body"></div>';
  root.innerHTML = html;

  root.querySelectorAll('.ps-tab').forEach(t => t.addEventListener('click', () => {
    PS.tab = t.dataset.pstab; PS.openDay = null; renderPerson();
  }));
  psRenderBody();
}

function psTopicHTML(tp) {
  let h = '<div class="ps-topic">';
  if (tp.category) h += '<span class="cat">' + psEsc(tp.category) + '</span>';
  h += '<h3>' + psEsc(tp.title) + '</h3>';
  h += '<div class="body">' + psEsc(tp.body).replace(/\n/g, '<br>') + '</div>';
  if (tp.image) h += psImg(tp.image);
  if (tp.quote && tp.quote.text) h += '<div class="quote">「' + psEsc(tp.quote.text) + '」' + (tp.quote.source ? '<br>— ' + psEsc(tp.quote.source) : '') + '</div>';
  if (tp.detail) h += '<div class="ps-detail">' + psEsc(tp.detail).replace(/\n/g, '<br>') + '</div>';
  if (Array.isArray(tp.links) && tp.links.length) {
    h += '<div class="ps-links">' + tp.links.map(l => '<a href="' + psEsc(l.url) + '" target="_blank" rel="noopener">' + psEsc(l.label || l.url) + '</a>').join('') + '</div>';
  }
  if (Array.isArray(tp.related_people) && tp.related_people.length) {
    h += '<div class="ps-chips">' + tp.related_people.map(p => '<span class="ps-chip">' + psEsc(p) + '</span>').join('') + '</div>';
  }
  h += '</div>';
  return h;
}

function psNotesHTML(day) {
  const notes = (psSlot().notes[day] || []);
  return notes.map(n => '<div class="ps-note"><span class="ts">' + psEsc(n.ts) + '</span>' + psEsc(n.text).replace(/\n/g, '<br>') + '</div>').join('');
}
function psMemoHTML(day) {
  return '<div class="ps-memo">'
    + '<div class="ps-memo-hint">思ったことをメモ（キーボードの🎤で音声入力できます）</div>'
    + '<textarea id="ps-memo-input" placeholder="このトピックについて考えたこと"></textarea>'
    + '<div class="data-btn-row" style="margin-top:6px"><button class="data-btn" id="ps-memo-save">メモを保存</button></div>'
    + '<div id="ps-notes">' + psNotesHTML(day) + '</div>'
    + '</div>';
}
function psWireMemo(day) {
  const save = document.getElementById('ps-memo-save');
  if (!save) return;
  save.addEventListener('click', () => {
    const inp = document.getElementById('ps-memo-input');
    const txt = (inp.value || '').trim();
    if (!txt) return;
    const s = psSlot();
    if (!s.notes[day]) s.notes[day] = [];
    const now = new Date();
    const ts = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0')
      + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    s.notes[day].push({ ts, text: txt });
    ensureToday();
    store.habits.logs[todayStr()][PS_HABIT] = true;
    saveStore();
    inp.value = '';
    document.getElementById('ps-notes').innerHTML = psNotesHTML(day);
    if ('vibrate' in navigator) navigator.vibrate(30);
    showToast('メモを保存しました（人物研究 ✓）');
  });
}

function psRenderBody() {
  const body = document.getElementById('ps-body');
  const d = PS.data;
  const today = new Date().getDate();
  const total = d.topics.length;

  if (PS.tab === 'today') {
    const day = Math.min(today, total);
    const tp = d.topics.find(t => t.day === day) || d.topics[day - 1];
    if (!tp) { body.innerHTML = '<div class="ps-empty">今日のトピックはありません。</div>'; return; }
    body.innerHTML = psTopicHTML(tp) + psMemoHTML(tp.day)
      + (today > total ? '' : '<div class="ps-progress" style="margin-top:14px">明日また新しいトピックが届きます</div>')
      + '<div class="data-btn-row" style="margin-top:16px"><button class="data-btn" id="ps-export">メモをレポート用に書き出す</button></div>';
    psWireMemo(tp.day);
    document.getElementById('ps-export').addEventListener('click', psExport);
    return;
  }

  if (PS.tab === 'history') {
    if (PS.openDay) {
      const tp = d.topics.find(t => t.day === PS.openDay);
      body.innerHTML = '<button class="ps-back" id="ps-back">← 一覧へ</button>'
        + psTopicHTML(tp) + psMemoHTML(tp.day);
      document.getElementById('ps-back').addEventListener('click', () => { PS.openDay = null; psRenderBody(); });
      psWireMemo(tp.day);
      return;
    }
    let h = '<div class="ps-daylist">';
    d.topics.forEach(tp => {
      const locked = tp.day > today;
      const hasNote = (psSlot().notes[tp.day] || []).length > 0;
      h += '<div class="ps-dayrow' + (locked ? ' locked' : '') + (hasNote ? ' has-note' : '') + '"'
        + (locked ? '' : ' data-openday="' + tp.day + '"') + '>'
        + '<span class="d">' + tp.day + '日</span>'
        + '<span class="t">' + psEsc(locked ? '——' : tp.title) + '</span></div>';
    });
    h += '</div>';
    body.innerHTML = h;
    body.querySelectorAll('[data-openday]').forEach(r => r.addEventListener('click', () => {
      PS.openDay = +r.dataset.openday; psRenderBody();
    }));
    return;
  }

  // resources
  const r = d.resources || {};
  const sec = (title, arr, fmt) => (Array.isArray(arr) && arr.length)
    ? '<h4>' + title + '</h4>' + arr.map(fmt).join('') : '';
  let h = '<div class="ps-res">';
  h += sec('書籍', r.books, b => '<a href="' + psEsc(b.url || '#') + '" target="_blank" rel="noopener">' + psEsc(b.title) + '</a><span class="meta">' + psEsc([b.author, b.year].filter(Boolean).join(' / ')) + (b.note ? ' — ' + psEsc(b.note) : '') + '</span>');
  h += sec('特集・記事', r.articles, a => '<a href="' + psEsc(a.url) + '" target="_blank" rel="noopener">' + psEsc(a.title) + '</a><span class="meta">' + psEsc([a.publisher, a.year].filter(Boolean).join(' / ')) + '</span>');
  h += sec('動画・インタビュー', r.videos, v => '<a href="' + psEsc(v.url) + '" target="_blank" rel="noopener">' + psEsc(v.title) + '</a><span class="meta">' + psEsc([v.platform, v.length].filter(Boolean).join(' / ')) + '</span>');
  h += sec('アーカイブ・リンク', r.archives, a => '<a href="' + psEsc(a.url) + '" target="_blank" rel="noopener">' + psEsc(a.label) + '</a>');
  h += '<h4>今月の全体メモ</h4>'
    + '<textarea id="ps-monthmemo" style="width:100%;min-height:80px;border:1px solid var(--line-strong);border-radius:3px;padding:11px 12px;font-size:16px;line-height:1.7;font-family:var(--font-gothic);background:var(--bg);color:var(--ink)">' + psEsc(psSlot().monthMemo) + '</textarea>'
    + '<div class="data-btn-row" style="margin-top:6px"><button class="data-btn" id="ps-mm-save">保存</button></div>';
  h += '</div>';
  if (!h.includes('<a ') && !r.books) h = '<div class="ps-empty">資料はまだ登録されていません。</div>' + h;
  body.innerHTML = h;
  const mm = document.getElementById('ps-mm-save');
  if (mm) mm.addEventListener('click', () => {
    const mmText = document.getElementById('ps-monthmemo').value;
    psSlot().monthMemo = mmText;
    if (mmText.trim()) { ensureToday(); store.habits.logs[todayStr()][PS_HABIT] = true; }
    saveStore(); showToast(mmText.trim() ? '保存しました（人物研究 ✓）' : '保存しました');
  });
}

function psExport() {
  const d = PS.data, s = psSlot();
  let out = '# 人物研究メモ ' + d.month + ' — ' + d.person + '\n\n';
  d.topics.forEach(tp => {
    const notes = s.notes[tp.day] || [];
    if (!notes.length) return;
    out += '## Day ' + tp.day + ' — ' + tp.title + '\n';
    notes.forEach(n => { out += '- (' + n.ts + ') ' + n.text + '\n'; });
    out += '\n';
  });
  if (s.monthMemo) out += '## 今月の全体メモ\n' + s.monthMemo + '\n';
  if (out.indexOf('## ') < 0) { showToast('まだメモがありません'); return; }
  const share = navigator.share && navigator.canShare;
  if (share) {
    navigator.share({ title: '人物研究メモ ' + d.month, text: out }).catch(() => psCopy(out));
  } else {
    psCopy(out);
  }
}
function psCopy(txt) {
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => showToast('メモをコピーしました（Claude に貼れます）')).catch(() => psDl(txt));
  else psDl(txt);
}
function psDl(txt) {
  const blob = new Blob([txt], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'person-study-notes-' + (PS.data ? PS.data.month : '') + '.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}


// ── 起動 ──
ensureToday();
renderSyncState();
loadPerson();
renderPerson();
document.getElementById('sync-save').addEventListener('click', async () => {
  const g = loadGh();
  g.repo = document.getElementById('sync-repo').value.trim() || GH_DEFAULT.repo;
  g.path = document.getElementById('sync-path').value.trim() || GH_DEFAULT.path;
  const tk = document.getElementById('sync-token').value.trim();
  if (tk) g.token = tk;
  g.auto = true;
  localStorage.setItem(GH_KEY, JSON.stringify(g));
  document.getElementById('sync-token').value = '';
  showToast('同期しています…');
  const ok = await syncPerson();
  showToast(ok ? '同期しました' : '同期に失敗しました。トークンを確かめてください');
  renderSyncState();
});
// 設定があれば、起動の少しあとに同期先のメモを取り込む（起動の通信を増やさないよう、30分に1回まで）
setTimeout(() => {
  if (!loadGh().token) return;
  const last = Number(localStorage.getItem('person_pull') || 0);
  if (Date.now() - last < 30 * 60 * 1000) return;
  localStorage.setItem('person_pull', String(Date.now()));
  syncPerson();
}, 2000);
// 別のアプリで変更したあとに戻ってきたとき、最新の保存データを読み直す（入力中のメモは消さない）
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  store = loadStore(); ensureToday();
  const typing = document.activeElement && document.activeElement.tagName === 'TEXTAREA' && document.activeElement.value;
  if (!typing) renderPerson();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});

</script>
</body>
</html>
